<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Assets — MMM (HC-9489 A&V v2)</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-base:#010514;
  --bg-surface:#05112a;
  --bg-surface-2:#091a38;
  --bg-elevated:#0d2347;
  --bg-hover:#112d5a;
  --bg-selected:#0e2550;
  --border:#1b3a6b;
  --border-light:#243d6b;
  --text-primary:#e8edf5;
  --text-secondary:#8a9bbf;
  --text-muted:#526180;
  --accent-teal:#00d4d4;
  --accent-teal-dim:#00a0a0;
  --accent-orange:#ff8c00;
  --accent-purple:#9b59d0;
  --accent-green:#3dd68c;
  --accent-red:#f04e4e;
  --accent-yellow:#f5c842;
  --font:'Siemens Sans','Inter',system-ui,sans-serif;
  --radius:4px;--radius-lg:8px;--radius-xl:12px;
  --panel-min-width:480px;
}
html,body,#root{height:100%;background:var(--bg-base);color:var(--text-primary);font-family:var(--font);font-size:13px}
button{cursor:pointer;font-family:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.app{display:flex;flex-direction:column;height:100%}

/* TOP NAV */
.top-nav{height:46px;background:var(--bg-surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 14px;gap:10px;flex-shrink:0;z-index:100}
.top-nav .logo{width:26px;height:26px;background:var(--accent-teal);border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:var(--bg-base);flex-shrink:0}
.top-nav .brand{font-weight:600;font-size:14px}
.top-nav .sep{color:var(--text-muted);font-size:12px}
.top-nav .tenant{color:var(--text-secondary);font-size:12px}
.top-nav .spacer{flex:1}
.top-nav .nav-link{padding:4px 10px;font-size:12px;color:var(--text-secondary);cursor:pointer;border-radius:var(--radius)}
.top-nav .nav-link:hover,.top-nav .nav-link.active{background:var(--bg-elevated);color:var(--text-primary)}
.top-nav .nav-link.active{color:var(--accent-teal)}
.top-nav .avatar{width:26px;height:26px;background:var(--accent-purple);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff}

/* BODY */
.main-body{display:flex;flex:1;overflow:hidden}
.left-nav{width:46px;background:var(--bg-surface);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:2px;flex-shrink:0;overflow:visible;position:relative}
.nav-icon{width:34px;height:34px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--text-muted);cursor:pointer;transition:all .12s;position:relative;font-size:15px}
.nav-icon:hover,.nav-icon.active{background:var(--bg-elevated);color:var(--accent-teal)}
.nav-icon.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent-teal);border-radius:0 2px 2px 0}
.nav-spacer{flex:1}
.submenu{position:absolute;left:46px;top:auto;bottom:0;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:var(--radius-lg);width:190px;z-index:300;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.submenu-item{padding:9px 14px;cursor:pointer;color:var(--text-secondary);font-size:12px;display:flex;align-items:center;gap:8px}
.submenu-item:hover,.submenu-item.active{background:var(--bg-elevated);color:var(--text-primary)}
.submenu-item.active{color:var(--accent-teal)}

/* CONTENT */
.content{flex:1;overflow:auto;display:flex;flex-direction:column}

/* BUTTONS */
.btn{padding:5px 12px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-primary);font-size:12px;display:inline-flex;align-items:center;gap:5px;transition:all .12s;white-space:nowrap}
.btn:hover{background:var(--bg-hover);border-color:var(--border-light)}
.btn.primary{background:var(--accent-teal);border-color:var(--accent-teal);color:var(--bg-base);font-weight:600}
.btn.primary:hover{background:var(--accent-teal-dim);border-color:var(--accent-teal-dim)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-secondary)}
.btn.ghost:hover{background:var(--bg-hover);color:var(--text-primary)}
.btn.danger{border-color:var(--accent-red);color:var(--accent-red)}
.btn.danger:hover{background:rgba(240,78,78,.1)}
.search-box{padding:5px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-primary);outline:none;transition:border-color .12s}
.search-box:focus{border-color:var(--accent-teal)}
.search-box::placeholder{color:var(--text-muted)}

/* TYPE FILTER BAR — fix 5 */
.type-filter-bar{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;background:var(--bg-surface);flex-shrink:0}
.type-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--bg-surface-2);color:var(--text-secondary);font-size:12px;cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:6px}
.type-btn:hover{border-color:var(--border-light);color:var(--text-primary);background:var(--bg-elevated)}
.type-btn.active{border-color:var(--accent-teal);background:rgba(0,212,212,.1);color:var(--accent-teal);font-weight:600}
.type-btn .count-badge{font-size:10px;background:var(--bg-elevated);color:var(--text-muted);padding:1px 5px;border-radius:8px;font-weight:400}
.type-btn.active .count-badge{background:rgba(0,212,212,.2);color:var(--accent-teal)}
.subtype-bar{padding:5px 16px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:6px;background:var(--bg-surface);flex-shrink:0}
.subtype-chip{padding:3px 10px;border-radius:10px;border:1px solid var(--border);font-size:11px;color:var(--text-muted);cursor:pointer;transition:all .12s}
.subtype-chip:hover{color:var(--text-primary);border-color:var(--border-light)}
.subtype-chip.active{border-color:var(--accent-teal);color:var(--accent-teal);background:rgba(0,212,212,.08)}

/* TABLE */
.table-toolbar{height:44px;border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:8px;flex-shrink:0;background:var(--bg-surface)}
.table-toolbar .title{font-weight:600;font-size:14px}
.table-wrap{flex:1;overflow:auto}
table{width:100%;border-collapse:collapse}
thead th{padding:7px 12px;text-align:left;font-size:10px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);background:var(--bg-surface);position:sticky;top:0;white-space:nowrap}
tbody tr{border-bottom:1px solid rgba(27,58,107,.5);cursor:pointer;transition:background .08s}
tbody tr:hover{background:var(--bg-hover)}
tbody tr.selected{background:var(--bg-selected)}
tbody td{padding:7px 12px;font-size:12px;color:var(--text-secondary);vertical-align:middle}

/* CONDITION BAR in table — fix 1 */
.cond-cell{display:flex;align-items:center;gap:8px;min-width:110px}
.cond-score{font-size:13px;font-weight:700;width:28px;flex-shrink:0;text-align:right}
.cond-bar-track{flex:1;height:5px;background:var(--bg-elevated);border-radius:3px;overflow:hidden}
.cond-bar-fill{height:100%;border-radius:3px}
.cond-label{font-size:10px;color:var(--text-muted);flex-shrink:0}

/* PILLS */
.pill{padding:2px 7px;border-radius:8px;font-size:11px;font-weight:500;display:inline-block;white-space:nowrap}
.pill.road{background:rgba(0,212,212,.12);color:var(--accent-teal)}
.pill.bridge{background:rgba(155,89,208,.12);color:var(--accent-purple)}
.pill.building{background:rgba(255,140,0,.12);color:var(--accent-orange)}
.pill.pipe{background:rgba(61,214,140,.12);color:var(--accent-green)}
.pill.active{background:rgba(61,214,140,.12);color:var(--accent-green)}
.pill.inactive{background:rgba(82,97,128,.12);color:var(--text-muted)}
.pill.maintenance{background:rgba(255,140,0,.12);color:var(--accent-orange)}

/* SIDE PANEL */
.side-panel{flex:0 0 50%;min-width:var(--panel-min-width);background:var(--bg-surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}

/* PANEL HERO — fix 1: condition score prominent at top */
.panel-hero{padding:16px;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:12px}
.panel-hero-top{display:flex;align-items:flex-start;gap:12px}
.asset-type-icon{width:44px;height:44px;background:var(--bg-elevated);border-radius:var(--radius-lg);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.panel-asset-info{flex:1}
.panel-asset-name{font-weight:700;font-size:16px;color:var(--text-primary);line-height:1.2}
.panel-asset-meta{font-size:11px;color:var(--text-muted);margin-top:3px;display:flex;align-items:center;gap:8px}
.panel-hero-close{background:none;border:none;color:var(--text-muted);font-size:16px;cursor:pointer;padding:2px;line-height:1;flex-shrink:0}
.panel-hero-close:hover{color:var(--text-primary)}

/* CONDITION HERO STRIP — fix 1 */
.condition-hero-strip{display:grid;grid-template-columns:1fr auto;align-items:center;gap:16px;background:var(--bg-surface-2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:12px 14px}
.chs-score{text-align:center}
.chs-score .big{font-size:32px;font-weight:800;line-height:1}
.chs-score .label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-top:2px}
.chs-bars{display:flex;flex-direction:column;gap:5px;flex:1}
.chs-bar-row{display:flex;align-items:center;gap:8px}
.chs-bar-name{font-size:11px;color:var(--text-secondary);width:150px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chs-bar-track{flex:1;height:4px;background:var(--bg-elevated);border-radius:2px;overflow:hidden}
.chs-bar-fill{height:100%;border-radius:2px}
.chs-bar-val{font-size:11px;font-weight:600;width:24px;text-align:right;flex-shrink:0}
.chs-actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}

/* TABS */
.tab-bar{display:flex;border-bottom:1px solid var(--border);background:var(--bg-surface);flex-shrink:0}
.tab{padding:9px 14px;font-size:12px;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;transition:all .12s;white-space:nowrap;display:flex;align-items:center;gap:5px}
.tab:hover{color:var(--text-primary)}
.tab.active{color:var(--accent-teal);border-bottom-color:var(--accent-teal)}
.tab .new-badge{font-size:9px;background:rgba(0,212,212,.2);color:var(--accent-teal);border-radius:6px;padding:1px 5px;font-weight:600}
.panel-body{flex:1;overflow:auto;padding:16px}

/* VALUATION STRIP — fix 3 */
.val-strip{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:1px;background:var(--border);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:16px}
.val-cell{background:var(--bg-surface-2);padding:12px 14px}
.val-cell .vc-label{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.val-cell .vc-value{font-size:16px;font-weight:700;color:var(--text-primary)}
.val-cell .vc-sub{font-size:10px;color:var(--text-muted);margin-top:2px}
.val-cell .vc-link{font-size:10px;color:var(--accent-teal);cursor:pointer;margin-top:3px;display:flex;align-items:center;gap:3px}
.aasb-banner{background:rgba(0,212,212,.06);border:1px solid rgba(0,212,212,.2);border-radius:var(--radius);padding:8px 12px;font-size:11px;color:var(--text-secondary);margin-bottom:16px;display:flex;align-items:flex-start;gap:8px}
.aasb-banner .icon{font-size:14px;flex-shrink:0;margin-top:1px}

/* SECTION */
.section{margin-bottom:18px}
.section-title{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.section-title .hc-tag{background:rgba(0,212,212,.12);color:var(--accent-teal);padding:1px 6px;border-radius:6px;font-size:9px;text-transform:none;letter-spacing:0;font-weight:600}

/* ATTR PROFILE — fix 2: combined tab */
.attr-group{margin-bottom:16px}
.attr-group-label{font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.attr-row{display:flex;align-items:center;padding:5px 0;gap:8px}
.attr-row:not(:last-child){border-bottom:1px solid rgba(27,58,107,.4)}
.attr-key{font-size:12px;color:var(--text-muted);flex-shrink:0;width:150px}
.attr-val{font-size:12px;color:var(--text-primary);flex:1}
.attr-val.enum{color:var(--accent-teal);background:rgba(0,212,212,.08);padding:1px 7px;border-radius:4px;display:inline-block}

/* CONDITION DETAIL in profile tab */
.cvar-card{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:11px 13px;margin-bottom:8px}
.cvar-card-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cvar-card-name{font-size:12px;font-weight:600;color:var(--text-primary)}
.cvar-score-pill{font-size:15px;font-weight:800}
.cvar-bar-track{height:5px;background:var(--bg-elevated);border-radius:3px;overflow:hidden;margin-bottom:6px}
.cvar-bar-fill{height:100%;border-radius:3px}
.cvar-meta-row{display:flex;gap:14px;font-size:10px;color:var(--text-muted)}
.weight-pill{background:var(--bg-elevated);color:var(--text-secondary);padding:1px 6px;border-radius:4px;font-size:10px}

/* SPEC ROWS */
.spec-row{display:flex;padding:5px 0;gap:8px;border-bottom:1px solid rgba(27,58,107,.4)}
.spec-row:last-child{border-bottom:none}
.spec-key{width:150px;flex-shrink:0;color:var(--text-muted);font-size:12px}
.spec-val{color:var(--text-primary);font-size:12px;flex:1}

/* ACTIVITY */
.activity-item{padding:8px 0;border-bottom:1px solid rgba(27,58,107,.4);display:flex;gap:10px;align-items:flex-start}
.activity-item:last-child{border-bottom:none}
.activity-dot{width:7px;height:7px;border-radius:50%;background:var(--accent-teal);flex-shrink:0;margin-top:3px}
.activity-text{font-size:12px;color:var(--text-secondary);flex:1}
.activity-time{font-size:10px;color:var(--text-muted);white-space:nowrap}

/* WEIGHT EDITOR — fix 4 */
.weight-editor{margin-top:8px}
.we-bar{height:28px;border-radius:var(--radius-lg);overflow:hidden;display:flex;margin-bottom:12px;gap:1px}
.we-seg{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:rgba(255,255,255,.9);transition:flex .2s;cursor:pointer;position:relative;min-width:20px}
.we-seg:hover::after{content:'';position:absolute;inset:0;background:rgba(255,255,255,.1)}
.we-rows{display:flex;flex-direction:column;gap:6px}
.we-row{display:flex;align-items:center;gap:10px}
.we-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.we-name{font-size:12px;color:var(--text-secondary);flex:1}
.we-input{width:52px;padding:3px 6px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-primary);text-align:center;font-size:12px;outline:none}
.we-input:focus{border-color:var(--accent-teal)}
.we-pct{font-size:11px;color:var(--text-muted)}
.we-total{font-size:12px;font-weight:600;margin-top:6px;text-align:right}
.we-total.ok{color:var(--accent-green)}
.we-total.bad{color:var(--accent-red)}

/* SETTINGS */
.settings-layout{display:flex;flex:1;overflow:hidden}
.settings-sidebar{width:196px;background:var(--bg-surface);border-right:1px solid var(--border);padding:12px 0;flex-shrink:0}
.settings-nav-item{padding:8px 16px;font-size:12px;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .1s}
.settings-nav-item:hover{background:var(--bg-hover);color:var(--text-primary)}
.settings-nav-item.active{background:var(--bg-selected);color:var(--accent-teal)}
.settings-content{flex:1;overflow:auto;padding:24px}
.settings-title{font-size:17px;font-weight:700;color:var(--text-primary);margin-bottom:3px}
.settings-sub{font-size:12px;color:var(--text-muted);margin-bottom:20px}

/* TEMPLATE CARDS */
.template-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px}
.tc{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px;cursor:pointer;transition:all .12s}
.tc:hover,.tc.sel{border-color:var(--accent-teal);background:var(--bg-elevated)}
.tc-icon{font-size:22px;margin-bottom:8px}
.tc-name{font-size:13px;font-weight:600;color:var(--text-primary);margin-bottom:2px}
.tc-sub{font-size:11px;color:var(--text-muted);margin-bottom:6px}
.tc-counts{font-size:11px;color:var(--text-secondary)}
.tc-counts span{color:var(--accent-teal);font-weight:600}

/* TEMPLATE DETAIL */
.td-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.back-btn{background:none;border:none;color:var(--accent-teal);cursor:pointer;font-size:12px;display:flex;align-items:center;gap:3px;padding:0}
.back-btn:hover{text-decoration:underline}
.attr-table{border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:20px}
.attr-th{display:grid;padding:7px 12px;background:var(--bg-surface);border-bottom:1px solid var(--border);font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px}
.attr-tr{display:grid;padding:8px 12px;border-bottom:1px solid rgba(27,58,107,.4);align-items:center;transition:background .08s}
.attr-tr:last-child{border-bottom:none}
.attr-tr:hover{background:var(--bg-hover)}
.attr-cols-5{grid-template-columns:1fr 90px 70px 80px 80px}
.custom-badge{font-size:9px;background:rgba(155,89,208,.15);color:var(--accent-purple);padding:1px 5px;border-radius:4px;font-weight:600}
.canonical-key{font-size:10px;color:var(--text-muted);font-family:monospace}
.type-badge{font-size:10px;background:var(--bg-elevated);color:var(--text-secondary);padding:2px 6px;border-radius:4px}
.hot-badge{color:var(--accent-orange);font-size:11px}

/* FORM */
.form-row{margin-bottom:13px}
.form-label{font-size:10px;color:var(--text-muted);margin-bottom:4px;display:flex;align-items:center;gap:5px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.req{color:var(--accent-red)}
.form-input{width:100%;padding:7px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-primary);outline:none;transition:border-color .12s}
.form-input:focus{border-color:var(--accent-teal)}
.form-select{width:100%;padding:7px 10px;border-radius:var(--radius);border:1px solid var(--border);background:var(--bg-elevated);color:var(--text-primary);outline:none}
.form-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-section-label{font-size:11px;font-weight:700;color:var(--accent-teal);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.slider{width:100%;accent-color:var(--accent-teal);margin-top:4px}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px}
.modal{background:var(--bg-surface-2);border:1px solid var(--border);border-radius:var(--radius-xl);width:700px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.modal-sm{width:460px}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-weight:700;font-size:15px}
.modal-body{flex:1;overflow:auto;padding:20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* MANAGE */
.manage-table{width:100%;border-collapse:collapse}
.manage-th{padding:7px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);background:var(--bg-surface);position:sticky;top:0}
.manage-td{padding:7px 12px;font-size:12px;color:var(--text-secondary);border-bottom:1px solid rgba(27,58,107,.4)}

// count assets per type
function countByType(type){
  function c(arr){return arr.reduce((n,a)=>{
    let x=a.type===type?1:0;
    if(a.children)x+=c(a.children);
    return n+x;
  },0);}
  return c(ASSETS);
}

function flattenVisible(arr,expanded,depth=0){
  const out=[];
  for(const a of arr){
    out.push({...a,depth});
    if(a.children&&a.children.length&&expanded[a.id])
      out.push(...flattenVisible(a.children,expanded,depth+1));
  }
  return out;
}

// ── ASSETS TABLE ──────────────────────────────────────────────────────────
function AssetsTable({onSelect,selectedId,typeFilter,setTypeFilter,subtypeFilter,setSubtypeFilter,onNew}){
  const [expanded,setExpanded]=useState({a1:true,a2:true,a3:true});
  const [search,setSearch]=useState('');
  const [attrFilters,setAttrFilters]=useState({});

  // clear attr filters when type changes
  const prevTypeRef=React.useRef(typeFilter);
  React.useEffect(()=>{if(prevTypeRef.current!==typeFilter){setAttrFilters({});prevTypeRef.current=typeFilter;}},[typeFilter]);

  const toggle=id=>setExpanded(e=>({...e,[id]:!e[id]}));

  // enum attrs for current type (KOQ 2 filter options)
  const enumAttrsForType=typeFilter&&TEMPLATES[typeFilter]
    ?TEMPLATES[typeFilter].attrs.filter(a=>a.type==='Enum')
    :[];

  function matchesAttrFilters(a){
    if(!Object.keys(attrFilters).length)return true;
    const vals=ASSET_ATTRS[a.id]||{};
    return Object.entries(attrFilters).every(([k,v])=>!v||String(vals[k])===v);
  }

  let roots=ASSETS;
  if(typeFilter)roots=ASSETS.filter(a=>a.type===typeFilter);
  if(subtypeFilter)roots=roots.filter(a=>a.subtype===subtypeFilter);

  function vis(arr,depth=0){
    const out=[];
    for(const a of arr){
      const match=!search||a.name.toLowerCase().includes(search.toLowerCase())||a.assetId.toLowerCase().includes(search.toLowerCase());
      if(match&&matchesAttrFilters(a))out.push({...a,depth});
      if(a.children&&a.children.length&&expanded[a.id])out.push(...vis(a.children,depth+1));
    }
    return out;
  }
  const rows=vis(roots);
  const subtypes=typeFilter?(TYPE_META[typeFilter]?.subtypes||[]):[];

  // counts for type buttons
  const typeCounts={};
  for(const t of ASSET_TYPES){
    let c=0;
    function countType(arr){arr.forEach(a=>{if(a.type===t)c++;if(a.children)countType(a.children);});}
    countType(ASSETS);
    typeCounts[t]=c;
  }
  const totalCount=Object.values(typeCounts).reduce((a,b)=>a+b,0);

  return(
    <div style={{display:'flex',flexDirection:'column',flex:1,overflow:'hidden'}}>
      <div className="table-toolbar">
        <span className="title">Assets</span>
        <div style={{flex:1}}/>
        <input className="search-box" placeholder="Search by name or ID…" value={search} onChange={e=>setSearch(e.target.value)} style={{width:220}}/>
        <button className="btn">⬇ Export</button>
        <button className="btn primary" onClick={onNew}>+ New Asset</button>
      </div>

      {/* TYPE FILTER BAR — fix 5 */}
      <div className="type-filter-bar">
        <button className={`type-btn${!typeFilter?' active':''}`} onClick={()=>{setTypeFilter('');setSubtypeFilter('');}}>
          All <span className="count-badge">{totalCount}</span>
        </button>
        {ASSET_TYPES.map(t=>(
          <button key={t} className={`type-btn${typeFilter===t?' active':''}`}
            onClick={()=>{setTypeFilter(typeFilter===t?'':t);setSubtypeFilter('');}}>
            {TYPE_META[t]?.icon} {t} <span className="count-badge">{typeCounts[t]||0}</span>
          </button>
        ))}
      </div>

      {typeFilter&&subtypes.length>0&&(
        <div className="subtype-bar">
          <span style={{fontSize:11,color:'var(--text-muted)',marginRight:4}}>Subtype:</span>
          {subtypes.map(s=>(
            <span key={s} className={`subtype-chip${subtypeFilter===s?' active':''}`}
              onClick={()=>setSubtypeFilter(subtypeFilter===s?'':s)}>{s}</span>
          ))}
        </div>
      )}

      {/* KOQ 2 — A&V attribute value filter */}
      {typeFilter&&enumAttrsForType.length>0&&(
        <div className="attr-filter-row">
          <span style={{fontSize:11,fontWeight:700,color:'var(--text-muted)',marginRight:4,whiteSpace:'nowrap'}}>
            Filter by {ATTR_LABEL}:
          </span>
          {enumAttrsForType.map(a=>{
            // collect distinct values from ASSET_ATTRS for this type
            const vals=[...new Set(
              ASSETS.flatMap(asset=>[asset,...(asset.children||[])])
                .filter(asset=>asset.type===typeFilter)
                .map(asset=>(ASSET_ATTRS[asset.id]||{})[a.key])
                .filter(Boolean)
            )];
            if(!vals.length)return null;
            return(
              <select key={a.key} className="form-select" style={{fontSize:11,padding:'2px 6px',height:26,minWidth:0}}
                value={attrFilters[a.key]||''}
                onChange={e=>setAttrFilters(f=>({...f,[a.key]:e.target.value}))}>
                <option value="">{a.label}: All</option>
                {vals.map(v=><option key={v} value={v}>{v}</option>)}
              </select>
            );
          })}
          {Object.values(attrFilters).some(Boolean)&&(
            <span className="filter-chip">
              {Object.entries(attrFilters).filter(([,v])=>v).map(([k,v])=>{
                const attr=enumAttrsForType.find(a=>a.key===k);
                return(
                  <span key={k} style={{display:'inline-flex',alignItems:'center',gap:3}}>
                    {attr?.label}: <strong>{v}</strong>
                    <span className="filter-chip-x" onClick={()=>setAttrFilters(f=>({...f,[k]:''}))}> ×</span>
                  </span>
                );
              })}
            </span>
          )}
          <span style={{fontSize:10,background:'rgba(0,212,212,.08)',color:'var(--accent-teal)',padding:'2px 7px',borderRadius:4,border:'1px solid rgba(0,212,212,.2)',whiteSpace:'nowrap',marginLeft:'auto'}}>
            KOQ 2 — A&V bulk query
          </span>
        </div>
      )}

      <div className="table-wrap">
        <table>
          <thead>
            <tr>
              <th style={{width:'28%'}}>Asset Name</th>
              <th>ID</th>
              <th>Type</th>
              <th>Status</th>
              <th style={{minWidth:130}}>Condition Score</th>
              <th>Location</th>
            </tr>
          </thead>
          <tbody>
            {rows.map(a=>(
              <tr key={a.id} className={selectedId===a.id?'selected':''} onClick={()=>onSelect(a)}>
                <td>
                  <div style={{display:'flex',alignItems:'center',gap:5}}>
                    {a.children&&a.children.length?(
                      <button style={{width:16,height:16,border:'none',background:'transparent',color:'var(--text-muted)',fontSize:10,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}
                        onClick={e=>{e.stopPropagation();toggle(a.id);}}>
                        {expanded[a.id]?'▾':'▸'}
                      </button>
                    ):<span style={{width:16,display:'inline-block'}}/>}
                    <span style={{marginLeft:a.depth*14,color:'var(--text-primary)',fontWeight:a.depth===0?500:400}}>{a.name}</span>
                  </div>
                </td>
                <td style={{fontFamily:'monospace',fontSize:10,color:'var(--text-muted)'}}>{a.assetId}</td>
                <td><TypePill type={a.type}/></td>
                <td><StatusPill status={a.status}/></td>
                <td><CondCell assetId={a.id}/></td>
                <td style={{fontSize:11,color:'var(--text-muted)'}}>{a.location}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div className="pagination">
        <span className="info">Showing {rows.length} assets{typeFilter?` · ${typeFilter}`:''}{subtypeFilter?` › ${subtypeFilter}`:''}</span>
        <div className="page-btns">
          <button className="page-btn">‹</button>
          <button className="page-btn active">1</button>
          <button className="page-btn">2</button>
          <button className="page-btn">›</button>
        </div>
      </div>
    </div>
  );
}

// ── WEIGHT EDITOR ─────────────────────────────────────────────────────────
// vars: [{key,label}] — platform template definition (no weight here)
// weights: {key: number} — tenant config, separate from variable definition
// onWeightsChange: (newWeights) => void
function WeightEditor({vars,weights,onWeightsChange,dimmed}){
  const total=vars.reduce((s,v)=>s+(weights[v.key]||0),0);
  const colors=CVAR_COLORS;
  return(
    <div className="weight-editor" style={dimmed?{opacity:.45,pointerEvents:'none'}:{}}>
      {/* visual bar */}
      <div className="we-bar">
        {vars.map((v,i)=>{
          const w=weights[v.key]||0;
          return(
            <div key={v.key} className="we-seg"
              style={{flex:w||1,background:colors[i%colors.length],fontSize:10,color:'rgba(0,0,0,.8)'}}>
              {w>8?`${w}%`:''}
            </div>
          );
        })}
      </div>
      <div className="we-rows">
        {vars.map((v,i)=>(
          <div key={v.key} className="we-row">
            <div className="we-dot" style={{background:colors[i%colors.length]}}/>
            <span className="we-name">{v.label}</span>
            <input className="we-input" type="number" min={0} max={100} value={weights[v.key]||0}
              onChange={e=>{
                const nw=Math.max(0,+e.target.value);
                onWeightsChange({...weights,[v.key]:nw});
              }}/>
            <span className="we-pct">%</span>
          </div>
        ))}
      </div>
      {!dimmed&&<div className={`we-total ${total===100?'ok':'bad'}`}>
        Total: {total}% {total!==100&&`— needs ${100-total>0?'+':''}${100-total}%`}
      </div>}
    </div>
  );
}

// ── TEMPLATE DETAIL ────────────────────────────────────────────────────────

  const [attrs,setAttrs]=useState(orig?orig.attrs:[]);

  const [addAttr,setAddAttr]=useState(false);
  const [reqVar,setReqVar]=useState(false);
  const [saved,setSaved]=useState(false);
  // wgtAvg defaults false per spec: "if no rule configured, condition_score independently editable"
  const [wgtAvg,setWgtAvg]=useState(origCondCfg.wgtAvgEnabled);
  // varWeights is tenant config — separate from platform variable definition
  const [varWeights,setVarWeights]=useState(origCondCfg.varWeights);
  const [renaming,setRenaming]=useState({});
  const [removeAttr,setRemoveAttr]=useState(null); // guard modal target

  const meta=TYPE_META[tmplKey]||{icon:'📋'};

        <div style={{background:'var(--bg-elevated)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'6px 12px',marginBottom:14,fontSize:11,color:'var(--text-muted)',display:'flex',alignItems:'center',gap:8}}>

          <span>Some fields are standard and cannot be edited</span>

        </div>
      )}

        <button className="back-btn" onClick={onBack}>← Templates</button>

        <div>
          <div style={{fontWeight:700,fontSize:16,color:'var(--text-primary)'}}>{tmplKey}</div>
          <div style={{fontSize:11,color:'var(--text-muted)'}}>{isReadOnly?'Classification Template · Read-only':'Classification Template'}</div>
        </div>
        {!isReadOnly&&(
          <div style={{marginLeft:'auto',display:'flex',gap:8,alignItems:'center'}}>
            {saved&&<span style={{fontSize:11,color:'var(--accent-green)'}}>✔ Saved</span>}
            <button className="btn primary" onClick={save}>Save Changes</button>
          </div>
        )}
      </div>

      {/* ATTRIBUTES */}
      <div style={{marginBottom:24}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:10}}>

          {!isReadOnly&&<button className="btn" style={{fontSize:11}} onClick={()=>setAddAttr(true)}>+ Add Custom Attribute</button>}
        </div>
        <div className="attr-table">
          <div className="attr-th" style={{gridTemplateColumns:'1fr 90px 70px 80px 130px'}}>
            <span>Name</span><span>Type</span><span>Unit</span><span>Required</span><span>Source</span>
          </div>
          {attrs.map((a)=>{
            const isRenaming=!isReadOnly&&renaming.hasOwnProperty(a.key);
            return(
              <div key={a.key} className="attr-tr" style={{gridTemplateColumns:'1fr 90px 70px 80px 130px'}}>
                <div style={{display:'flex',flexDirection:'column',gap:2}}>
                  {isRenaming?(
                    <div style={{display:'flex',alignItems:'center',gap:6}}>
                      <input className="form-input" value={renaming[a.key]} onChange={e=>setRenaming(r=>({...r,[a.key]:e.target.value}))} style={{height:24,padding:'2px 6px',fontSize:12,width:160}}/>
                      <button className="btn" style={{fontSize:10,padding:'2px 6px'}} onClick={()=>setRenaming(r=>{const n={...r};delete n[a.key];return n;})}>Done</button>

// ── ASSET TYPEAHEAD ───────────────────────────────────────────────────────
function AssetTypeahead({value,onChange}){
  const [query,setQuery]=React.useState(value||'');
  const [open,setOpen]=React.useState(false);
  const [selection,setSelection]=React.useState(null);
  const [cascade,setCascade]=React.useState(null);
  const ref=React.useRef();
  React.useEffect(()=>{
    function h(e){if(ref.current&&!ref.current.contains(e.target))setOpen(false);}
    document.addEventListener('mousedown',h);
    return()=>document.removeEventListener('mousedown',h);
  },[]);
  function buildResults(q){
    if(!q||q.length<1)return[];
    const ql=q.toLowerCase();
    const seen=new Set();
    const results=[];
    for(const item of TAXONOMY_FLAT){
      const levels=[{level:'type',text:item.type},{level:'subgroup',text:item.subgroup},{level:'group',text:item.group},{level:'class',text:item.assetClass}];
      for(const l of levels){
        if(l.text.toLowerCase().includes(ql)){
          const key=`${item.assetClass}|${item.group}|${item.subgroup}|${item.type}`;
          if(!seen.has(key)){seen.add(key);results.push({...item,matchedLevel:l.level});}
          break;
        }
      }
    }
    return results.slice(0,10);
  }
  function classesAvail(){return[...new Set(TAXONOMY_FLAT.map(i=>i.assetClass))];}
  function groupsAvail(cls){return[...new Set(TAXONOMY_FLAT.filter(i=>i.assetClass===cls).map(i=>i.group))];}
  function subgroupsAvail(cls,grp){return[...new Set(TAXONOMY_FLAT.filter(i=>i.assetClass===cls&&i.group===grp).map(i=>i.subgroup))];}
  function typesAvail(cls,grp,sub){return TAXONOMY_FLAT.filter(i=>i.assetClass===cls&&i.group===grp&&i.subgroup===sub);}
  function resolveAndFire(next){
    const full=TAXONOMY_FLAT.find(i=>i.type===next.type&&i.assetClass===next.assetClass&&i.group===next.group&&i.subgroup===next.subgroup);
    onChange(full?{...full,matchedLevel:next.matchedLevel}:null);
  }
  function updateCascade(level,val){
    let next={...cascade};
    if(level==='assetClass'){
      next.assetClass=val;
      next.group=groupsAvail(val)[0]||'';
      next.subgroup=subgroupsAvail(val,next.group)[0]||'';
      const t=typesAvail(val,next.group,next.subgroup)[0];
      if(t){next.type=t.type;next.icon=t.icon;next.tmplKey=t.tmplKey;}
    }else if(level==='group'){
      next.group=val;
      next.subgroup=subgroupsAvail(next.assetClass,val)[0]||'';
      const t=typesAvail(next.assetClass,val,next.subgroup)[0];
      if(t){next.type=t.type;next.icon=t.icon;next.tmplKey=t.tmplKey;}
    }else if(level==='subgroup'){
      next.subgroup=val;
      const t=typesAvail(next.assetClass,next.group,val)[0];
      if(t){next.type=t.type;next.icon=t.icon;next.tmplKey=t.tmplKey;}
    }else if(level==='type'){
      const t=TAXONOMY_FLAT.find(i=>i.type===val&&i.assetClass===next.assetClass&&i.group===next.group&&i.subgroup===next.subgroup);
      if(t){next.type=t.type;next.icon=t.icon;next.tmplKey=t.tmplKey;}
    }
    setCascade(next);
    setQuery(next.type);
    resolveAndFire(next);
  }
  function select(item){
    const c={...item,searchQuery:query};
    setQuery(item.type);setSelection(item);setCascade(c);setOpen(false);onChange(item);
  }
  const overridden=cascade&&selection&&cascade.type!==selection.type;
  const showFeedback=cascade&&(cascade.matchedLevel!=='type'||overridden);
  const results=buildResults(query);
  return(
    React.createElement('div',{className:'ta-wrap',ref},
      React.createElement('input',{className:'form-input',value:query,
        onChange:e=>{setQuery(e.target.value);setOpen(true);setCascade(null);setSelection(null);onChange(null);},
        onFocus:()=>setOpen(true),
        placeholder:'Search: Road Carriageway, Bridge, Stormwater Pipe, Building…',
        autoComplete:'off'}),
      open&&query.length>0&&React.createElement('div',{className:'ta-results'},
        results.length>0?results.map((item,i)=>
          React.createElement('div',{key:i,className:'ta-item',onClick:()=>select(item)},
            React.createElement('span',{className:'ta-icon'},item.icon),
            React.createElement('div',{style:{flex:1,minWidth:0}},
              React.createElement('div',{className:'ta-name'},item.type,!item.tmplKey&&React.createElement('span',{style:{fontSize:9,color:'var(--text-muted)',fontWeight:400}},' No template yet')),
              React.createElement('div',{className:'ta-path'},
                React.createElement('span',null,item.assetClass),
                React.createElement('span',{className:'ta-sep'},'›'),
                React.createElement('span',null,item.group),
                React.createElement('span',{className:'ta-sep'},'›'),
                React.createElement('span',null,item.subgroup),
                item.matchedLevel!=='type'&&React.createElement('span',{className:'ta-level-badge'},'matched at '+item.matchedLevel)
              )
            )
          )
        ):React.createElement('div',{className:'ta-no-results'},'No match — try a broader term or contact platform to add this asset type.')
      ),
      cascade&&React.createElement('div',{className:'tax-cascade'},
        React.createElement('div',null,
          React.createElement('div',{className:'tax-lvl-label'},'Asset Class'),
          React.createElement('select',{style:{width:'100%',background:'var(--bg-surface-2)',color:'var(--accent-teal)',border:'1px solid rgba(0,212,212,.25)',borderRadius:'var(--radius)',padding:'2px 4px',fontSize:11,fontWeight:500},value:cascade.assetClass,onChange:e=>updateCascade('assetClass',e.target.value)},
            classesAvail().map(c=>React.createElement('option',{key:c,value:c},c)))
        ),
        React.createElement('div',null,
          React.createElement('div',{className:'tax-lvl-label'},'Asset Group'),
          React.createElement('select',{style:{width:'100%',background:'var(--bg-surface-2)',color:'var(--accent-teal)',border:'1px solid rgba(0,212,212,.25)',borderRadius:'var(--radius)',padding:'2px 4px',fontSize:11,fontWeight:500},value:cascade.group,onChange:e=>updateCascade('group',e.target.value)},
            groupsAvail(cascade.assetClass).map(g=>React.createElement('option',{key:g,value:g},g)))
        ),
        React.createElement('div',null,
          React.createElement('div',{className:'tax-lvl-label'},'Asset Subgroup'),
          React.createElement('select',{style:{width:'100%',background:'var(--bg-surface-2)',color:'var(--accent-teal)',border:'1px solid rgba(0,212,212,.25)',borderRadius:'var(--radius)',padding:'2px 4px',fontSize:11,fontWeight:500},value:cascade.subgroup,onChange:e=>updateCascade('subgroup',e.target.value)},
            subgroupsAvail(cascade.assetClass,cascade.group).map(s=>React.createElement('option',{key:s,value:s},s)))
        ),
        React.createElement('div',null,
          React.createElement('div',{className:'tax-lvl-label'},'Asset Type'),
          React.createElement('select',{style:{width:'100%',background:'var(--bg-surface-2)',color:'var(--accent-teal)',border:'1px solid rgba(0,212,212,.25)',borderRadius:'var(--radius)',padding:'2px 4px',fontSize:11,fontWeight:500},value:cascade.type,onChange:e=>updateCascade('type',e.target.value)},
            typesAvail(cascade.assetClass,cascade.group,cascade.subgroup).map(t=>React.createElement('option',{key:t.type,value:t.type},t.type)))
        )
      ),

// ── SURVEY FORM ───────────────────────────────────────────────────────────
function SurveyForm({asset,onClose}){
  const tmpl=TEMPLATES[asset.type];
  const condCfg=TENANT_COND_CONFIG[asset.type]||{wgtAvgEnabled:false,varWeights:{}};
  const existing=ASSET_CONDITIONS[asset.id];
  const [defaultDate,setDefaultDate]=React.useState(new Date().toISOString().slice(0,10));
  const [surveyor,setSurveyor]=React.useState('');
  // condition_score for manual entry (only used when wgtAvgEnabled=false)
  const [manualScore,setManualScore]=React.useState(
    existing?existing.overall.toString():''
  );
  const [vars,setVars]=React.useState(()=>{
    if(!tmpl)return[];
    return tmpl.condVars.map(c=>{  // fixed: was tmpl.conditions (crash)
      const ex=existing&&existing.vars.find(v=>v.key===c.key);
      // observation only: score + assessDate — no weight in survey record
      return{key:c.key,label:c.label,score:ex?ex.score:5,assessDate:ex?ex.surveyDate:new Date().toISOString().slice(0,10),override:false};
    });
  });
  function setVar(i,field,val){setVars(prev=>{const n=[...prev];n[i]={...n[i],[field]:val};return n;});}

  // weighted avg — only computed when tenant has configured it
  const weightedAvg=condCfg.wgtAvgEnabled?(()=>{
    const totalW=Object.values(condCfg.varWeights).reduce((s,w)=>s+w,0);
    if(!totalW)return null;
    const sum=vars.reduce((s,v)=>s+(v.score*(condCfg.varWeights[v.key]||0)),0);
    return(sum/totalW).toFixed(1);
  })():null;

  return(
    React.createElement('div',{className:'modal-overlay',onClick:e=>{if(e.target.className==='modal-overlay')onClose();}},
      React.createElement('div',{className:'modal',style:{maxWidth:580,maxHeight:'90vh',overflowY:'auto'}},
        React.createElement('div',{className:'modal-header'},
          React.createElement('span',{className:'modal-title'},'📋 Record Condition Survey — '+asset.name),
          React.createElement('button',{className:'modal-close',onClick:onClose},'×')
        ),
        React.createElement('div',{className:'modal-body'},
          React.createElement('div',{className:'form-grid',style:{gridTemplateColumns:'1fr 1fr',marginBottom:16}},
            React.createElement('div',{className:'form-group'},
              React.createElement('label',{className:'form-label'},'Default Survey Date'),
              React.createElement('input',{className:'form-input',type:'date',value:defaultDate,
                onChange:e=>{setDefaultDate(e.target.value);setVars(prev=>prev.map(v=>v.override?v:{...v,assessDate:e.target.value}));}})
            ),
            React.createElement('div',{className:'form-group'},
              React.createElement('label',{className:'form-label'},'Surveyor / Organisation'),
              React.createElement('input',{className:'form-input',value:surveyor,onChange:e=>setSurveyor(e.target.value),placeholder:'e.g. Pavement Solutions Pty'})
            )
          ),
          React.createElement('div',{style:{fontSize:11,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:.5,marginBottom:10}},'Condition Variables'),
          vars.map((v,i)=>
            React.createElement('div',{key:v.key,className:'svar-row'},
              React.createElement('div',{className:'svar-header'},
                React.createElement('div',{className:'svar-name'},v.label),
                React.createElement('span',{className:'svar-score-big',style:{color:v.score>=7?'var(--accent-green)':v.score>=5?'var(--accent-orange)':'var(--accent-red)'}},v.score.toFixed(1))
              ),
              React.createElement('input',{type:'range',min:0,max:10,step:0.1,value:v.score,
                style:{width:'100%',accentColor:'var(--accent-teal)',marginBottom:8},
                onChange:e=>setVar(i,'score',parseFloat(e.target.value))}),
              React.createElement('div',{className:'svar-meta-grid'},
                React.createElement('div',{className:'form-group',style:{margin:0}},
                  React.createElement('label',{className:'form-label',style:{display:'flex',alignItems:'center',gap:6}},
                    'Assessment Date',
                    v.override&&React.createElement('span',{style:{fontSize:9,background:'rgba(255,140,0,.2)',color:'var(--accent-orange)',padding:'1px 5px',borderRadius:4}},'custom')
                  ),
                  React.createElement('input',{className:'form-input',type:'date',value:v.assessDate,
                    onChange:e=>setVar(i,'assessDate',e.target.value)||setVar(i,'override',true)})
                ),
                React.createElement('div',{className:'form-group',style:{margin:0}},
                  React.createElement('label',{className:'form-label'},'Notes (optional)'),
                  React.createElement('input',{className:'form-input',placeholder:'Observation…'})
                )
              )
            )
          ),
          // condition_score section — shown below variables, differs by tenant config
          React.createElement('div',{style:{marginTop:16,padding:'10px 12px',background:'var(--bg-surface-2)',border:'1px solid var(--border)',borderRadius:'var(--radius)'}},
            condCfg.wgtAvgEnabled
              ? React.createElement('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between'}},
                  React.createElement('div',null,
                    React.createElement('div',{style:{fontSize:11,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:.5}},'condition_score'),
                    React.createElement('div',{style:{fontSize:10,color:'var(--text-muted)',marginTop:2}},'Auto-computed · tenant weighted average')
                  ),
                  React.createElement('span',{style:{fontSize:22,fontWeight:800,color:'var(--accent-teal)'}},weightedAvg+' / 10')
                )
              : React.createElement('div',null,
                  React.createElement('div',{style:{fontSize:11,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:.5,marginBottom:6}},'condition_score (optional)'),
                  React.createElement('div',{style:{fontSize:10,color:'var(--text-muted)',marginBottom:8}},'No weighted average configured for this asset type. Enter a summary score manually, or leave blank.'),
                  React.createElement('div',{style:{display:'flex',alignItems:'center',gap:10}},
                    React.createElement('input',{className:'form-input',type:'number',min:0,max:10,step:0.1,
                      value:manualScore,onChange:e=>setManualScore(e.target.value),
                      placeholder:'0.0 – 10.0',style:{width:100}}),
                    React.createElement('span',{style:{fontSize:11,color:'var(--text-muted)'}},'/10')
                  )
                )
          ),
          React.createElement('div',{className:'success-notice',style:{marginTop:12}},
            React.createElement('span',null,'ℹ️'),
            React.createElement('span',null,'Each variable records its own assessment date. Dates override the default when surveys are staggered across different inspection events.')
          )
        ),
        React.createElement('div',{className:'modal-footer'},
          React.createElement('button',{className:'btn secondary',onClick:onClose},'Cancel'),
          React.createElement('button',{className:'btn primary',onClick:()=>{
            alert('Survey saved — '+vars.length+' condition variables recorded for '+asset.name+' (prototype: data not persisted)');
            onClose();
          }},'Save Survey')
        )
      )
    )
  );
}

          <button className="btn" onClick={onClose}>Cancel</button>

function LocNode({node,depth=0}){
  const [open,setOpen]=useState(depth<2);
  const [editing,setEditing]=useState(false);
  const [name,setName]=useState(node.name);
  const has=node.children&&node.children.length>0;
  const icons={Organisation:'🏢',Ward:'🗺️',Precinct:'📍',Segment:'📌'};
  return(
    <div>
      <div style={{display:'flex',alignItems:'center',gap:6,padding:'5px 0',paddingLeft:depth*20,borderBottom:'1px solid rgba(27,58,107,.4)'}}>
        {has?<button style={{width:16,height:16,border:'none',background:'transparent',color:'var(--text-muted)',fontSize:10,cursor:'pointer'}} onClick={()=>setOpen(o=>!o)}>{open?'▾':'▸'}</button>:<span style={{width:16}}/>}
        <span style={{flexShrink:0}}>{icons[node.type]||'📌'}</span>
        {editing?<input className="form-input" value={name} onChange={e=>setName(e.target.value)} style={{height:24,padding:'2px 6px',fontSize:12,width:200}}/>
        :<span style={{fontSize:12,color:'var(--text-primary)',flex:1}}>{name}</span>}
        <span style={{fontSize:11,color:'var(--text-muted)',marginRight:8}}>{node.type}</span>
        {editing?<button className="btn" style={{fontSize:11,padding:'2px 8px'}} onClick={()=>setEditing(false)}>Save</button>
        :<button className="btn ghost" style={{fontSize:11}} onClick={()=>setEditing(true)}>✏️</button>}
        <button className="btn ghost" style={{fontSize:11}}>+</button>
      </div>
      {open&&has&&node.children.map(c=><LocNode key={c.id} node={c} depth={depth+1}/>)}
    </div>
  );
}

        <div className="success-notice" style={{marginBottom:20}}>✅ All candidates reviewed. Canonical templates are up to date.</div>
      )}

      {active.map(c=>{
        const canonLabel=editLabels[c.attr]!==undefined?editLabels[c.attr]:c.attr;
        const canonType=editTypes[c.attr]||c.dataTypes[0];
        const canonKey=c.attr.toLowerCase().replace(/[\s()\/]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'');
        return(
          <div key={c.attr} className="promotion-card">
            <div className="promo-header">
              <div style={{flex:1}}>
                <div className="promo-name">{c.attr}</div>
                <div className="promo-meta">
                  <TypePill type={c.type}/>
                  <span className="hot-badge">🔥 {c.count} tenants</span>
                  independently defined this attribute
                </div>
              </div>
              <span className="stage-chip candidate">Candidate</span>
            </div>

            <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:.4,marginBottom:6}}>
              How tenants defined it — spot inconsistencies before promoting
            </div>
            <div className="tenant-defs">
              <div style={{display:'grid',gridTemplateColumns:'160px 1fr 70px 100px',gap:8,padding:'3px 0 5px',borderBottom:'1px solid rgba(27,58,107,.5)',fontSize:9,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:.4}}>
                <span>Tenant</span><span>Label used</span><span>Type</span><span>Unit / Values</span>
              </div>
              {c.tenantDefs.map((d,i)=>(
                <div key={i} className="tenant-def-row">
                  <span style={{color:'var(--text-muted)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{d.tenant}</span>
                  <span style={{color:'var(--text-primary)',fontWeight:500}}>"{d.label}"</span>
                  <span className="type-badge">{d.type}</span>
                  <span style={{fontSize:10,color:'var(--text-muted)'}}>{d.unit||'—'}</span>
                </div>
              ))}
            </div>

            <div style={{fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:.4,marginBottom:8}}>
              Define canonical — this becomes the single source of truth
            </div>
            <div className="canonical-form">
              <div>
                <div className="form-label">Display Label <span style={{color:'var(--accent-teal)',fontWeight:400,textTransform:'none'}}>(tenant-facing)</span></div>
                <input className="form-input" value={canonLabel}
                  onChange={e=>setEditLabels(l=>({...l,[c.attr]:e.target.value}))}/>
              </div>
              <div>
                <div className="form-label">Data Type</div>
                <select className="form-select" value={canonType}
                  onChange={e=>setEditTypes(t=>({...t,[c.attr]:e.target.value}))}>
                  {['Number','Integer','Text','Enum','Boolean','Date'].map(t=><option key={t}>{t}</option>)}
                </select>
              </div>
              <div>
                <div className="form-label">Canonical Key <span style={{color:'var(--text-muted)',fontWeight:400,textTransform:'none'}}>(immutable)</span></div>
                <input className="form-input" readOnly value={canonKey}
                  style={{fontFamily:'monospace',fontSize:11,color:'var(--text-muted)',background:'var(--bg-surface)'}}/>
              </div>
            </div>
            <div style={{fontSize:11,color:'var(--accent-yellow)',marginBottom:12,display:'flex',alignItems:'center',gap:6}}>
              ⚠️ Existing tenant custom attrs matching this key will be auto-migrated on promotion.
              {c.dataTypes.length>1&&<span style={{color:'var(--accent-orange)'}}> Type mismatch ({c.dataTypes.join('/')}) — verify before promoting.</span>}
            </div>

            <div style={{display:'flex',gap:8,justifyContent:'flex-end'}}>
              <button className="btn danger" style={{fontSize:11}} onClick={()=>setDismissed(d=>[...d,c.attr])}>Dismiss</button>
              <button className="btn primary" style={{fontSize:11}} onClick={()=>setPromoted(p=>[...p,c.attr])}>✓ Promote to Canonical</button>
            </div>
          </div>
        );
      })}

      <div style={{height:1,background:'var(--border)',margin:'4px 0 18px'}}/>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12}}>
        <span style={{fontSize:13,fontWeight:700,color:'var(--text-primary)'}}>Canonical Templates</span>
        <span style={{fontSize:11,color:'var(--text-muted)'}}>Click a template to edit its attribute set</span>
      </div>
      <div className="template-grid">
        {Object.keys(TEMPLATES).map(k=>{
          const m=TYPE_META[k]||{icon:'📋'};
          const t=TEMPLATES[k];
          return(
            <div key={k} className="tc" onClick={()=>onNavigateTemplate(k)}>
              <div className="tc-icon">{m.icon}</div>
              <div className="tc-name">{k}</div>
              <div className="tc-sub">{m.subtypes?m.subtypes.slice(0,2).join(' · ')+(m.subtypes.length>2?` +${m.subtypes.length-2}`:''):'—'}</div>
              <div className="tc-counts"><span>{t.attrs.length}</span> attrs · <span>{t.condVars.length}</span> cond vars</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── SETTINGS ──────────────────────────────────────────────────────────────
function SettingsPage({settingsPage,setSettingsPage,role,model,setModel,templateTarget,onTemplateTargetConsumed}){
  const nav=[
    {k:'general',icon:'🏢',label:'General'},
    {k:'users',icon:'👥',label:'Users & Roles'},
    {k:'locations',icon:'📍',label:'Locations'},
    {k:'templates',icon:'📐',label:'Classification Templates'},
  ];
  return(
    <div className="settings-layout">
      <div className="settings-sidebar">
        <div style={{padding:'10px 16px 6px',fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:.5}}>Settings</div>
        {nav.map(item=>(
          <div key={item.k} className={`settings-nav-item${settingsPage===item.k?' active':''}`} onClick={()=>setSettingsPage(item.k)}>
            <span>{item.icon}</span>{item.label}
          </div>
        ))}
      </div>
      <div style={{flex:1,overflow:'hidden',display:'flex',flexDirection:'column'}}>
        {settingsPage==='general'&&(
          <div className="settings-content">
            <div className="settings-title">General</div>
            <div className="form-row"><div className="form-label">Organisation Name</div><input className="form-input" defaultValue="City of Riverside Council" style={{maxWidth:360}}/></div>
            <div className="form-row"><div className="form-label">Tenant ID</div><input className="form-input" defaultValue="riverside-council-au" style={{maxWidth:360}} readOnly/></div>
            <button className="btn primary">Save</button>
          </div>
        )}
        {settingsPage==='users'&&<ManageUsers/>}
        {settingsPage==='locations'&&<ManageLocations/>}
        {settingsPage==='templates'&&<ClassificationTemplates role={role} model={model} setModel={setModel} initialSelected={templateTarget} onInitialSelectedConsumed={onTemplateTargetConsumed}/>}
      </div>
    </div>
  );
}

// ── LEFT NAV ──────────────────────────────────────────────────────────────
function LeftNav({page,setPage,settingsPage,setSettingsPage}){
  const [showSub,setShowSub]=useState(false);
  const ref=useRef();
  useEffect(()=>{
    function h(e){if(ref.current&&!ref.current.contains(e.target))setShowSub(false);}
    document.addEventListener('mousedown',h);return()=>document.removeEventListener('mousedown',h);
  },[]);
  return(
    <div className="left-nav" ref={ref}>
      {[
        {k:'home',icon:'🏠',label:'Home'},
        {k:'assets',icon:'📋',label:'Assets'},
        {k:'work',icon:'🔧',label:'Work Orders'},
        {k:'reports',icon:'📊',label:'Reports'},
      ].map(item=>(
        <div key={item.k} className={`nav-icon${page===item.k?' active':''}`} title={item.label}
          onClick={()=>{setPage(item.k);setShowSub(false);}}>
          {item.icon}
        </div>
      ))}
      <div className="nav-spacer"/>
      <div className={`nav-icon${page==='settings'?' active':''}`} title="Settings"
        onClick={()=>{setShowSub(s=>!s);setPage('settings');}}>⚙️</div>
      {showSub&&(
        <div className="submenu">
          <div style={{padding:'8px 14px 4px',fontSize:10,fontWeight:700,color:'var(--text-muted)',textTransform:'uppercase',letterSpacing:.5}}>Settings</div>
          {[
            {k:'general',icon:'🏢',label:'General'},
            {k:'users',icon:'👥',label:'Users & Roles'},
            {k:'locations',icon:'📍',label:'Locations'},
            {k:'templates',icon:'📐',label:'Classification Templates'},
          ].map(item=>(
            <div key={item.k} className={`submenu-item${settingsPage===item.k?' active':''}`}
              onClick={()=>{setSettingsPage(item.k);setShowSub(false);}}>
              <span>{item.icon}</span>{item.label}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ── HOME ─────────────────────────────────────────────────────────────────
function HomePage(){
  return(
    <div style={{padding:24,flex:1,overflow:'auto'}}>
      <div style={{fontSize:18,fontWeight:700,marginBottom:3}}>Good morning, Olivia</div>
      <div style={{fontSize:12,color:'var(--text-muted)',marginBottom:20}}>City of Riverside Council · Asset portfolio overview</div>
      <div className="kpi-grid">
        {[
          {label:'Maint. Cost YTD',value:'$1.24M',sub:'FY 2025–26'},
          {label:'Avg Condition Score',value:'5.8',sub:'Across 142 assets'},
          {label:'Assets Due Survey',value:'23',sub:'Next 90 days'},
          {label:'Replacement Value',value:'$84.6M',sub:'Current portfolio'},
        ].map(k=>(
          <div key={k.label} className="kpi-card">
            <div className="kpi-label">{k.label}</div>
            <div className="kpi-value">{k.value}</div>
            <div className="kpi-sub">{k.sub}</div>
          </div>
        ))}
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        <div style={{background:'var(--bg-surface-2)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:16}}>
          <div className="section-title">Condition Summary by Type</div>
          {[
            {type:'Road Carriageway',avg:5.5,count:48},
            {type:'Bridge',avg:5.6,count:12},
            {type:'Building',avg:7.1,count:31},
            {type:'Stormwater Pipe',avg:5.1,count:51},
          ].map(r=>(
            <div key={r.type} style={{marginBottom:12}}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                <span style={{fontSize:12,color:'var(--text-secondary)'}}>{r.type} <span style={{color:'var(--text-muted)',fontSize:11}}>({r.count})</span></span>
                <span style={{fontWeight:700,fontSize:13,color:scoreColor(r.avg)}}>{r.avg.toFixed(1)} — {condLabel(r.avg)}</span>
              </div>
              <div style={{height:6,background:'var(--bg-elevated)',borderRadius:3,overflow:'hidden'}}>
                <div style={{height:'100%',borderRadius:3,width:`${r.avg*10}%`,background:scoreColor(r.avg)}}/>
              </div>
            </div>
          ))}
        </div>
        <div style={{background:'var(--bg-surface-2)',border:'1px solid var(--border)',borderRadius:'var(--radius-lg)',padding:16}}>
          <div className="section-title">Recent Activity</div>
          {ACTIVITY.map((a,i)=>(
            <div key={i} className="activity-item">
              <div className="activity-dot"/>
              <span className="activity-text">{a.text}</span>
              <span className="activity-time">{a.time}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────
function App(){
  const [page,setPage]=useState('assets');
  const [settingsPage,setSettingsPage]=useState('templates');
  const [selectedAsset,setSelectedAsset]=useState(null);
  const [showForm,setShowForm]=useState(false);
  const [typeFilter,setTypeFilter]=useState('');
  const [subtypeFilter,setSubtypeFilter]=useState('');
  const [toast,setToast]=useState(null);
  const [role,setRole]=useState('tenant-admin');
  const [model,setModel]=useState(2);
  const [templateTarget,setTemplateTarget]=useState(null);

  function handleSetModel(m){
    setModel(m);
    if(m!==3)setRole('tenant-admin');
  }

  function showToast(msg){setToast(msg);setTimeout(()=>setToast(null),2500);}

  return(
    <div className="app">
      <div className="top-nav">
        <div className="logo">Si</div>
        <span className="brand">MMM</span>
        <span className="sep">/</span>
        <span className="tenant" style={{color:role!=='tenant-admin'?'var(--accent-purple)':'var(--text-secondary)'}}>
          {role==='tenant-admin'?'City of Riverside Council':role==='platform-analyst'?'Brightly Platform — Analyst':'Brightly Platform — Editor'}
        </span>
        <div style={{flex:1}}/>
        {['Home','Assets','Work','Reports'].map(p=>(
          <span key={p} className={`nav-link${page===p.toLowerCase()?' active':''}`}
            onClick={()=>{setPage(p.toLowerCase());if(p!=='Assets')setSelectedAsset(null);}}>
            {p}
          </span>
        ))}
        <div style={{width:1,height:18,background:'var(--border)',margin:'0 4px'}}/>
        <button className="btn ghost" style={{fontSize:13,padding:'3px 6px'}}>🔔</button>
        <div className="avatar" style={{background:role!=='tenant-admin'?'var(--accent-purple)':'#3b5cb8'}}>
          {role==='tenant-admin'?'OT':role==='platform-analyst'?'PA':'PE'}
        </div>
      </div>

      <div className="main-body">
        <LeftNav page={page} setPage={p=>{setPage(p);if(p!=='assets')setSelectedAsset(null);}}
          settingsPage={settingsPage} setSettingsPage={p=>{setSettingsPage(p);setPage('settings');}}/>
        <div className="content">
          {page==='home'&&<HomePage/>}
          {page==='assets'&&(
            <div style={{display:'flex',flex:1,overflow:'hidden'}}>
              <AssetsTable
                onSelect={setSelectedAsset} selectedId={selectedAsset?.id}
                typeFilter={typeFilter} setTypeFilter={setTypeFilter}
                subtypeFilter={subtypeFilter} setSubtypeFilter={setSubtypeFilter}
                onNew={()=>setShowForm(true)}/>
              {selectedAsset&&<SidePanel asset={selectedAsset} onClose={()=>setSelectedAsset(null)} onViewTemplate={type=>{setTemplateTarget(type);setSettingsPage('templates');setPage('settings');}} model={model}/>}
            </div>
          )}
          {page==='work'&&<div className="empty-state"><div className="empty-icon">🔧</div><div>Work Orders — not in scope for this prototype</div></div>}
          {page==='reports'&&<div className="empty-state"><div className="empty-icon">📊</div><div>Reports — not in scope for this prototype</div></div>}
          {page==='settings'&&<SettingsPage settingsPage={settingsPage} setSettingsPage={setSettingsPage} role={role} model={model} setModel={handleSetModel} templateTarget={templateTarget} onTemplateTargetConsumed={()=>setTemplateTarget(null)}/>}
        </div>
      </div>

      {showForm&&<AssetForm onClose={()=>{setShowForm(false);showToast('Asset saved.');}}/>}
      {toast&&<div className="toast">✅ {toast}</div>}
      <DemoPanel role={role} setRole={setRole} model={model} setModel={handleSetModel}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
